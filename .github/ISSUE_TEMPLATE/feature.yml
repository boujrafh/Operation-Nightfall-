name: Feature
description: A new feature or task from the implementation plan
labels: ['type:feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the player (or the project) get from this?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Clear acceptance criteria.
    validations:
      required: true
  - type: input
    id: doc
    attributes:
      label: Reference document
      description: Which of the 7 foundation documents describes this (e.g. Doc 04 §6)?
